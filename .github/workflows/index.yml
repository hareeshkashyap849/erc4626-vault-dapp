# Index new blocks on a schedule and commit the updated snapshot.
#
# THIS CRON RAN 105 TIMES AND SUCCEEDED 105 TIMES LESS THAN THAT. THE RECORD IS HERE
# BECAUSE A SCHEDULED WORKFLOW THAT FAILS SILENTLY LOOKS EXACTLY LIKE ONE THAT WORKS.
#
# Measured 2026-09-17 against the GitHub API, not read off a dashboard: runs #1..#105, all
# `event=schedule`, `conclusion=failure` for 104 of them and the 105th still queued when it
# was read and failing immediately after. Zero green runs, and **zero commits ever authored
# by `github-actions[bot]`** -- `data/vault.sqlite` has five commits and every one is the
# author's. So the published snapshot sat at block 46,919,979 while the chain head was
# 46,946,137: about 26,158 blocks, roughly 14.5 hours, stale. Nothing said so, because a
# failing scheduled workflow notifies nobody by default.
#
# Two causes, found in that order:
#
#   1. NO SECRET. `RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}` had never been created, so
#      the variable expanded to the empty string and the indexer stopped at once with
#      `RpcClient needs a url`. Runs #1..#105 all hit this. (Run #1 also failed one step
#      earlier, on a 404 for the deployment record, which did not exist yet.)
#   2. AN UNRETRIED 429. Once the secret existed the run got further and stopped on
#      `HTTP 429 Too Many Requests` -- on the SECOND request of the run, because a public
#      endpoint throttles GitHub's shared runner IPs. `src/lib/rpc.ts` treated that like any
#      other rejection: one retry after 250 ms, then throw. The throw skipped the commit step
#      below, so a momentary throttle cost a whole snapshot interval.
#
# The fix for (2) lives in `src/lib/rpc.ts`: a 429 or a 5xx is now retried with bounded
# exponential backoff, and any other 4xx still fails on the first attempt, because a 400 is a
# statement about the request and re-sending it only repeats the answer. The limit is
# concurrency rather than rate, which is why backing off works: 30 requests at once answer
# 200, 60 answer 40 x 200 and 20 x 429, and the same endpoint answers again a few seconds later.
#
# WHAT THIS COMMENT CANNOT ESTABLISH, AND WHERE TO CHECK IT: whether recent runs are green.
# The run history is the place. This is the record of what was measured on the date above, not
# a claim about now.
#
# WHY THE NUMBERS ARE WHAT THEY ARE
#
# THE INTERVAL IS NOT FIVE MINUTES, AND EVERY PARAMETER HERE IS SIZED AGAINST THE INTERVAL
# THAT IS MEASURED RATHER THAN THE ONE THAT WAS ASKED FOR.
#
# The cron below asks for `*/5`. GitHub's scheduler did not deliver it, and this is measured
# from the run history, not read off a dashboard: across the scheduled runs #93..#107, the
# gaps between consecutive runs were 15.4, 16.3, 17.0, 17.1, 18.6, 19.1, 20.1, 21.3, 22.4,
# 23.2, 23.6, 27.5 minutes (mean 19.4, median 19.1; the shortest gap over the 20 runs read
# was 12.7). "Every 5 minutes" is a lower bound that GitHub makes no promise about, and a
# workflow that cannot ask for anything shorter must not assume anything shorter either.
#
# Why that changes the parameters: Base produces a block every 2.000 seconds, so the nominal
# 5-minute interval would produce 150 blocks, while a real one produces 460-825 blocks
# (the median gap 19.1 min = 573, the worst gap 27.5 min = 825). A bound BELOW one interval
# is not a slower catch-up, it is a guaranteed net loss on every run, forever:
#
#   MAX_CATCHUP_BLOCKS was 300 -> the median interval produces 573 blocks and a run scanned
#   300 -> the gap grew by ~273 blocks between scheduler chances, with every run reporting
#   success and exiting 0. Measured on the two runs that did land: two green runs advanced the
#   snapshot by exactly 600 blocks (46,919,979 -> 46,920,579) while the head advanced 490
#   (46,946,749 -> 46,947,239), and the gap was still 26,259 and growing.
#
# That is the third time this project has chosen a pair of bounds that are jointly impossible,
# in a third way. The first two are kept below, because the pattern is the point: each time,
# both numbers looked reasonable on their own, and each time the error was the same -- a
# parameter sized against a nominal quantity (a 30-minute cron, a 5-minute cron) instead of a
# measured one.
#
# THE ARITHMETIC, from the measurements:
#
#   MAX_CATCHUP_BLOCKS = 3000
#     one real scheduler interval produces 460-825 blocks, so 3000 leaves 2175-2540 blocks of
#     headroom; at the rate the runner measured (300 blocks in 14,654 ms, run #108, so
#     20.5 blocks/s) it is 146 s of scanning, against 573 blocks produced per median interval --
#     a net drain of ~2427 blocks per interval, so the 26,612-block backlog measured on
#     2026-09-17 is ~11 intervals, as opposed to never.
#
#     AND IT WAS MEASURED AFTER THE CHANGE, on three consecutive runs of this workflow with
#     these exact values. Every one scanned its full 3000 and committed it, and the gap fell
#     each time -- against a chain that was still producing blocks throughout:
#
#       run #115 (manual)    46,921,179 -> 46,924,179   +3000 in 154,662 ms   gap 26,629 -> 23,833
#       run #116 (schedule)  46,924,179 -> 46,927,179   +3000 in 250,313 ms   gap 23,833 -> 21,002
#       run #117 (manual)    46,927,179 -> 46,930,179   +3000 in 167,502 ms   gap 21,002 -> 18,224
#
#     (each gap is the chain head AT THAT RUN against the block that run indexed, so the
#     blocks produced during the run are already counted against it. The three runs advanced
#     the snapshot 9000 blocks in about 11 minutes.) The scan rate measured 19.4, 12.0 and
#     17.9 blocks/s, so the rate moves with the endpoint and the log records which one applied;
#     17.5 blocks/s is the working figure, and every run still finished the whole bound.
#
#   MAX_CATCHUP_SECONDS = 450
#     this is a CEILING, not a target. It must not be the bound that decides a healthy run:
#     the conversion is `seconds x scan rate` (src/indexer/bounds.ts), the rate is the last
#     run's measured one, and 450 x 20.5 = 9225 blocks is far above the 3000 the block bound
#     allows, so the block bound decides. It must also fit the job: this job has
#     `timeout-minutes: 10`, and the budget is expressed as time spent INSIDE the indexer,
#     which starts about 11 s into the job -- checkout + setup-node + the test suite + the
#     record fetch measured 9-11 s across runs #115..#117. So a run that spent its whole
#     ceiling would end around 450 + 11 + a few seconds of commit and push, about 470 s of the
#     600 available, and it commits rather than being killed mid-scan. On a first, cold run --
#     no history, so the conservative 4 blocks/s default applies -- the ceiling allows 1800
#     blocks, which is deliberately the bound that decides until a rate has been measured.
#
#   Why not 6000: the same arithmetic gives 293 s at the measured rate, and the runs above show
#     the rate is not stable (12.0 blocks/s on the slowest of the three), so 6000 would need
#     500 s on a slow pass and would risk spending the whole 10-minute job on a scan that then
#     commits nothing. 3000 finished with room to spare on all three, including the slow one.
#
#   Why not more runners: two runners writing one SQLite file is a corruption, not a race worth
#     losing. The bound is how a single writer gets further per run.
#
# ONE WRITER AT A TIME, AND A BURST OF DISPATCHES IS NOT A FAILURE
#
# `concurrency: indexer` with `cancel-in-progress: false` is meant to serialise runs, and it
# does not do so tightly enough: four dispatches inside 15 s in run #110-#112 started
# concurrently, three were cancelled and the fourth committed locally and then failed with
#
#     ! [rejected] main -> main (fetch first)
#
# -- work that was already done, thrown away by a push that lost a race. The concurrency group
# stays (two writers on one SQLite file is corruption), and the commit step no longer assumes
# it won: it fetches, replays its own commit on top of whatever landed, and retries the push.
# On a conflict in the snapshot -- a SQLite file cannot be merged, only chosen -- it keeps the
# copy that is already published and re-commits, so a lost race costs one run's headway rather
# than the run. It never force-pushes, and it never discards another run's commit.
#
# THE FIRST VERSION OF THAT LOOP FAILED, AND THE WAY IT FAILED IS THE USEFUL PART.
#
# Run #119 was a real burst -- a scheduled run started 86 s after a manual dispatch, both
# indexed, and the scheduled one finished second. It failed after five attempts, every one of
# them with
#
#     ! [rejected] HEAD -> main (non-fast-forward)
#
# after an unbroken sequence of the replay conflicting, the run giving way, and the push being
# refused. Two things were wrong, and neither was visible in a single pass of the loop:
#
#   1. `git fetch origin main` does not reliably update `origin/main`. The loop READS
#      `origin/main` and was WRITING only FETCH_HEAD, so an attempt could replay against
#      history that was no longer the tip -- a conflict it "resolved" into a commit that
#      could not be pushed. Fixed by fetching the ref it reads, explicitly:
#      `+refs/heads/main:refs/remotes/origin/main`.
#   2. `git checkout origin/main -- data/vault.sqlite` un-aborted the replay without anchoring
#      the branch, so the give-way commit was not a descendant of the tip it was derived from.
#      `git reset --hard origin/main` both aborts the replay and anchors the branch, which
#      makes the next attempt start where this one did, and makes the whole step idempotent.
#
# The lesson is in the shape of the mistake rather than in either fix: the step was verified
# by a single-pass rehearsal, and the property that mattered was convergence across attempts.
# `tools/verify-push-race.mjs` now runs the loop, including a deliberately stale
# `origin/main` that reproduces defect 1 in isolation.
#
# WHY A CRON AND NOT A SERVICE
#
# No free hosting tier runs a long-lived process: Render sleeps a web service after
# 15 idle minutes, Railway's free credit is about $1/month, Koyeb gives 0.1 vCPU. So
# the indexer cannot be resident, and the design follows from that constraint rather
# than from a preference. The vault repository's ARCHITECTURE.md section 7 records
# the plan and the measurements behind its parameters.
#
# THE TWO EARLIER MISTAKES WITH THESE PARAMETERS, KEPT ON PURPOSE
#
#   1. A 30-minute cron with a 300-block bound. A 30-minute gap is more than 300 blocks, so
#      every catch-up would have timed out and the deployment would have been a snapshot that
#      was permanently 30 minutes stale, with catch-up code present and never working.
#   2. `MAX_CATCHUP_SECONDS = 20`, chosen from measuring what a 300-block catch-up costs in
#      wall clock -- the right question -- while the code converted that budget into blocks
#      using the CHAIN's 2.000 s block time, so 20 seconds meant 9 blocks against the 150 a
#      cron interval produces. Measured with those exact values: one run indexed 9 blocks and
#      reported TRUNCATED while the head advanced 58 blocks in the 90 seconds before it. Every
#      run looked successful and the snapshot fell further behind on every one. The conversion
#      is fixed (see src/indexer/bounds.ts) and the budget is a ceiling rather than a target.
#   3. `MAX_CATCHUP_BLOCKS = 300`, which was below one REAL scheduler interval as measured
#      above: 300 scanned against 460-825 produced. Two successful runs advanced the snapshot
#      by exactly 600 blocks while the chain added 742, and the gap grew from 25,700 to 26,612
#      with nothing but green runs to look at.
#
# WHAT THIS COMMENT CANNOT ESTABLISH, AND WHERE TO CHECK IT: whether recent runs are green,
# and whether the gap is closing. The run history and `last_indexed_block` are the places.
# This is the record of what was measured on the dates above, not a claim about now.
name: index

on:
  schedule:
    # Every 5 minutes, as asked for. MEASURED: GitHub delivers roughly every 15-27 minutes
    # under load (median 19.1), which is why MAX_CATCHUP_BLOCKS is sized against 19 minutes
    # of chain and not against 5. GitHub gives no cron interval shorter than 5 minutes, so
    # the spacing cannot be improved from here -- only the per-run bound can.
    - cron: '*/5 * * * *'
  # Manual runs, for when a catch-up is wanted immediately.
  workflow_dispatch:
    inputs:
      max_blocks:
        description: 'Maximum blocks to scan this run'
        required: false
        default: '3000'
# The job commits the snapshot, so it needs write access. Scoped to this workflow.
permissions:
  contents: write

# Two indexer runs writing one SQLite file is a corruption, not a race worth losing.
concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No `npm install`: this service has no runtime dependencies, and the tests have
      # no test framework beyond node:test. That is a deliberate property -- an
      # indexer a reviewer can run with nothing but Node is worth more than one that
      # needs a toolchain.
      - name: Run the test suite
        run: node tools/run-all.mjs

      # The deployment record lives in the vault repository. Fetching it rather than
      # copying the values here keeps ONE record of what was deployed where: a copy
      # would be a second place for the address to be wrong, and the wrong one would
      # be the one nobody updated.
      - name: Fetch the deployment record
        run: |
          mkdir -p deployments
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/wuzilin-web3/erc4626-vault/main/deployments/base-sepolia.json \
            --output deployments/base-sepolia.json
          echo "--- record ---"
          cat deployments/base-sepolia.json

      - name: Index new blocks
        env:
          DEPLOYMENT_RECORD: deployments/base-sepolia.json
          DATABASE_PATH: data/vault.sqlite
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          # 3000 blocks: 2175-2540 of headroom over the 460-825 a real scheduler interval
          # produces, and 146 s of scanning at the rate the runner measured. See the header.
          MAX_CATCHUP_BLOCKS: ${{ github.event.inputs.max_blocks || '3000' }}
          # A ceiling, not a target: 450 x the measured 20.5 blocks/s is 9225 blocks, well
          # above the block bound, so the block bound is what decides a healthy run. It is
          # 450 rather than 300 because at the conservative first-run rate of 4 blocks/s the
          # budget has to stay above one real interval, and 450 + the ~11 s the job spends
          # before the indexer starts is still inside the job's 10-minute timeout. Measured
          # after this change: 3000 blocks in 154-250 s across runs #115..#117, whole job
          # 165-263 s. See the header for the whole arithmetic.
          MAX_CATCHUP_SECONDS: '450'
        run: node --experimental-strip-types src/indexer/cli.ts --verbose

      # Committed rather than cached: a cache is evicted and a snapshot that vanishes
      # is a snapshot that has to be rebuilt from the deployment block, which on a
      # public endpoint is slow and possibly not permitted at all.
      #
      # AND COMMITTED IN A WAY THAT SURVIVES ANOTHER RUN PUSHING FIRST. `concurrency:
      # indexer` is not a strict serialiser: four dispatches inside 15 s in runs #110-#112
      # ran concurrently, and the one that finished last committed locally and then died on
      #
      #     ! [rejected] main -> main (fetch first)
      #
      # -- a run failing with its work already done. So the push is no longer the last
      # statement of the step: it is the last statement of a loop that fetches first, replays
      # this run's one commit on top of whatever landed, and retries. Every attempt can only
      # move the branch forward, and a rejected push is retried rather than fatal.
      - name: Commit the snapshot if it changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/vault.sqlite
          if git diff --staged --quiet; then
            echo "no change this run"
            exit 0
          fi

          # The block range goes in the message so the history of the snapshot is
          # readable from `git log` without opening the database.
          SUMMARY=$(node --experimental-strip-types -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('data/vault.sqlite');
            const s = db.prepare('SELECT last_indexed_block, chain_head_at_last_run FROM indexer_state WHERE id = 1').get();
            const n = db.prepare('SELECT COUNT(*) AS n FROM vault_events').get().n;
            console.log(\`indexed to block \${s.last_indexed_block} (head \${s.chain_head_at_last_run}), \${n} events\`);
          ")
          COMMIT_MSG="data: $SUMMARY"
          git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3 4 5; do
            # THE REFSPEC IS NOT DECORATION. `git fetch origin main` writes FETCH_HEAD and,
            # only when the remote's configured refspec covers that branch, the tracking ref
            # `origin/main` as well -- and this loop reads `origin/main`. The first version of
            # this step fetched plainly, and run #119 failed FIVE TIMES IN A ROW with
            #
            #     ! [rejected] HEAD -> main (non-fast-forward)
            #
            # for exactly that reason: the replay had conflicting history it had already
            # resolved, the give-way branch re-derived a commit that was no longer a
            # descendant of the tip, and every attempt repeated it. Naming the ref that is
            # read, explicitly and force-updated, leaves one answer per attempt to "what is
            # the remote tip" -- and the give-way branch below is idempotent on top of it.
            #
            # The ref name is spelled out rather than `git pull --rebase` because this step
            # has to be readable: what it reads, what it writes, and what it does when the
            # two disagree.
            git fetch origin +refs/heads/main:refs/remotes/origin/main

            # `git rebase` (not `git pull`): one commit of our own is replayed on top of the
            # remote tip, so the history stays linear and no merge commit is invented.
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push was rejected on attempt $attempt; the remote moved, retrying"
            else
              # A conflict here can only be `data/vault.sqlite`: it is a binary file and both
              # runs wrote different bytes. A SQLite snapshot cannot be merged, only chosen --
              # and the copy already on main has been published, so this run gives way to it.
              # The alternative is a `git push --force`, which would overwrite another run's
              # snapshot: exactly what the concurrency group exists to prevent.
              #
              # `git reset --hard origin/main` DOES TWO THINGS, and the second one is why it
              # replaces `git checkout origin/main -- ...`: it aborts the replay AND anchors
              # the branch to the tip that was just fetched. A give-way commit that is merely
              # "origin/main's file plus a new commit" is only pushable while the tip it was
              # derived from is still the tip; anchoring makes the next attempt start from the
              # same place this one did. Nothing of this run is lost by it -- the indexed rows
              # and the log are already in the run's own database, and the next run resumes
              # from wherever main ends up.
              git reset --hard origin/main
              echo "the snapshot conflicts with the published one; keeping the published copy"
              # Allowed to be empty: it is the record that this run did its work and then
              # deferred, and an empty commit changes no file -- which keeps the history
              # linear while making the outcome visible in `git log`.
              git commit --allow-empty -m "$COMMIT_MSG"
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push was rejected after giving way on attempt $attempt; retrying"
            fi
            sleep $((attempt * 5))
          done

          echo "::error::could not push the snapshot after 5 attempts; another run is writing this branch"
          exit 1
